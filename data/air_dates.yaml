    status: confirmed
    basis: "Announcer: «روز جمعه‌ی گذشته، شادروان رهی معیری… از میان ما رفت». Rahi died 24 Aban 1347 (Friday 15 Nov 1968)."
    basis_fa: "گوینده: «روز جمعه‌ی گذشته، شادروان رهی معیری… از میان ما رفت». رهی در ۲۴ آبان ۱۳۴۷ درگذشت."
  - program: "493"
