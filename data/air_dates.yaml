  - program: "405"
    date: "1345"                  # ~1966
    status: likely
    basis: "Amir: the last program recorded under Davud Pirnia. He left after the 1345 inspection by the Ministry of Information (Donya-e-Eqtesad); Radio Farda says he ran Golha for eleven years, until 1346. Recorded, not necessarily aired, then."
  - program: "420"
    date: "1345-10-22"            # 1967-01-12, Thursday
    status: confirmed
    basis: "«آن که دلم را» (Mahasti): broadcast on Golha, Thursday 22 Dey 1345 — Mahasti's song list (Persian Wikipedia, via Amir). The weekday matches."
  - program: "425"
    date: "1345-12"               # ~1967-03, the Nowruz program, aired before Nowruz
    status: likely
    basis: "«شادند جهانیان به نوروز و به عید… عید من و نوروز من امروز تویی»; 427 «بهار آمد و فروردین است». 428 aired in winter 1345, so 425–427 aired in late Esfand 1345, just before Nowruz."
  - program: "428"
    date: "1345-12"               # winter 1345, after 22 Dey (420)
    status: confirmed
    basis: "Broadcast on Golha in winter 1345 — Mahasti's song list (Persian Wikipedia, via Amir)"
  - program: "429"
    date: "1346-01"               # ~1967-03/04, around Nowruz 1346
    status: likely
    basis: "Amir: 423–429 all have a spring theme (spring words jump in 423–429, then drop in 430). With 420 on 22 Dey and 428 in winter 1345, the block runs through Esfand 1345 and ends around Nowruz 1346."
  - program: "439"
    date: "1346"                  # 1967, occasion unknown
    status: possible
    basis: "«عید همایون… شهنشاه جاوید و پاینده باد، ولیعهد والاگهر زنده باد… دل شاه‌بانو فرحناک باد». Amir: the crown prince's birthday (born 9 Aban 1339). Open question: 9 Aban 1345 (then 425 and earlier Nowruz anchors move one year back, and 439→448 is a slow year) or another occasion in 1346. 405 (Pirnia's last, ~1345) favours 1346."
  - program: "448"
    date: "1346-08-04"            # 1967-10-26, coronation and the Shah's birthday
    status: likely
    basis: "«مبارک باد تاج پادشاهی… شاهنشه آریامهر»; also «آفرین خدا به شهبانو که ولیعهد نازپرور زاد» (Amir): the coronation (4 Aban) or the crown prince's birthday (9 Aban), the same week. 449 also «به شاهنشه آریامهر ما»"

