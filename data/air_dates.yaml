    status: possible
    basis: "«نوید جشن خسروانه… از دولت شاه و شاهزاده… عید است»"
    basis_fa: "«نوید جشن خسروانه… از دولت شاه و شاهزاده». احتمالاً زادروز شاه، ۴ آبان ۱۳۴۷."
  - program: "484"
