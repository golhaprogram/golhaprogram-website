# Estimated air dates for Golha-ye Rangarang, worked out from programs made
# for a known occasion ("anchors"). No archive has real air dates; these are
# estimates and must be shown as such («حدود …»).
#
# Programs seem to have aired in number order, so programs between two
# anchors can be spaced evenly between them.
#
#   program:  file name (without .md)
#   date:     Solar Hijri YYYY-MM-DD (Gregorian in the comment)
#   status:   confirmed | likely | possible   (possible = needs Amir's review)
#   kind:     aired (default)
#             released_by — a record release or listing date; the broadcast
#                           was on or before it (upper bound)
#             not_before  — e.g. when a piece in it was composed; the broadcast
#                           was on or after it (lower bound), often soon after.
#                           point: false = never treat it as "aired soon after"
#   basis:    why (notes, English)
#   basis_fa: why, in Persian: shown on the site (/blog/air-dates/)

golhaye-rangarang:
  # --- 1335-1342 ---------------------------------------------------------
  - program: "100"
    date: "1335-01-01"            # 1956-03-21: Golha began; Rangarang came after
    kind: not_before
    point: false                  # a series start, not a composition date
    status: confirmed
    basis: "Amir: Golha-ye Rangarang starts at 100 (Ali Tajvidi also calls 100 the first, Hamshahri). Golha-ye Javidan, the first series, began 1 Farvardin 1335 (21 Mar 1956, Lewisohn); Rangarang came 'after some time'. Its month now follows from 135 (Nowruz 1336) and 174 (Dey 1336)."
    basis_fa: "گلهای رنگارنگ از برنامه‌ی ۱۰۰ آغاز شد (به گفته‌ی علی تجویدی). نخستین برنامه‌ی گلها، گلهای جاویدان، در ۱ فروردین ۱۳۳۵ پخش شد و گلهای رنگارنگ «پس از مدتی» آمد."
  - program: "135"
    date: "1336-01-01"            # 1957-03-21, Nowruz
    status: likely
    basis: "Amir: «طرب ای دل که نوبهار آمد / از صبا بوی زلف یار آمد»; 134 also spring: «باد بهار می‌رسد جلوه نسترن نگر». Not on our site."
    basis_fa: "«طرب ای دل که نوبهار آمد»؛ برنامه‌ی ۱۳۴ هم بهاری است: «باد بهار می‌رسد جلوه‌ی نسترن نگر». برنامه‌ی نوروز ۱۳۳۶."
  - program: "174"
    date: "1336-10"               # Dey 1336, right after Saba's death
    status: confirmed
    basis: "Amir: memorial for Abolhasan Saba: «شب جمعه بیست و نهم آذر بود که… سالکی به نام ابوالحسن صبا… پای به عرصهٔ زندگانی جاویدان نهاد», «بگریم خون که ناگه صبا رفت». Saba died the night before Friday 29 Azar 1336 (20 Dec 1957). 172 is the last program in our files with Saba playing. Not on our site."
    basis_fa: "در سوگ ابوالحسن صبا: «شب جمعه بیست و نهم آذر بود که… سالکی به نام ابوالحسن صبا… پای به عرصه‌ی زندگانی جاوید نهاد». صبا شب جمعه ۲۹ آذر ۱۳۳۶ درگذشت."
  - program: "209B"
    date: "1338-01-01"            # 1959-03-21, Nowruz
    status: likely
    basis: "Amir: 209 and 209B are spring/Nowruz programs (209 «نوبهار است بیا تا به چمن روی کنیم»; 209B has 7 spring words). The whole spring run is 205–212 (Amir): 205, 206 and 209 share «نوبهار است بیا تا به چمن روی کنیم», 212 «درخت غنچه برآورد و بلبلان مستند». The next Nowruz cluster is 224B/224C, a year later."
    basis_fa: "برنامه‌های ۲۰۵ تا ۲۱۲ بهاری‌اند («نوبهار است بیا تا به چمن روی کنیم»)؛ ۲۰۹ب برنامه‌ی نوروز ۱۳۳۸."
  - program: "216"
    date: "1337"                  # 1958-03 to 1959-03
    status: possible              # Amir: weak source; not used as a fixed point
    basis: "Amir: the tasnif «من از روز ازل» (Mahjubi, Rahi, Segah) was performed in Golha-ye Rangarang 195 and 216, in 1337. Our 216 has it, sung by Banan. Also: Habibollah Badiei joined Golha in 1337 (Amir), and 216 is the first of our programs with his name (none of 100–215 have it)."
    basis_fa: "تصنیف «من از روز ازل» در برنامه‌های ۱۹۵ و ۲۱۶ در سال ۱۳۳۷؛ حبیب‌الله بدیعی هم در ۱۳۳۷ به گلها پیوست. منبع ضعیف؛ در برآورد به کار نمی‌رود."

  - program: "219B"
    date: "1338-09-21"            # 1959-12-12, Azerbaijan Day
    status: likely
    basis: "Azerbaijan Day (21 Azar): «آهنگ آذربایجان کن… ای قبله‌ی آزادگان، وی خاک آذربادگان، فرخنده باد ایام تو… آشفته‌خاطر دشمن دون شد». Found after Amir's note on 329; the estimates already put 219B in late Aban 1338."
    basis_fa: "سالروز آذربایجان (۲۱ آذر): «ای خاک آذربادگان، فرخنده باد ایام تو… آشفته‌خاطر دشمن دون شد»."
  - program: "224B"
    date: "1339-01-01"            # 1960-03-21, Nowruz
    status: likely
    basis: "Amir: 224B and 224C fit Nowruz/spring (9 and 8 spring words, «چون نسیم نوبهار بر آشیانم کن گذر»). One year after 209B; 237 (composed Azar 1339) comes after."
    basis_fa: "۲۲۴ب و ۲۲۴ث بهاری‌اند («چون نسیم نوبهار بر آشیانم کن گذر»)؛ برنامه‌ی نوروز ۱۳۳۹."
  - program: "237"
    date: "1339-09"               # Azar 1339 (composed; lower bound)
    kind: not_before
    status: likely
    basis: "Khaleghi's last composition, the tasnif «خاموش» (Mahur, Rahi, sung by Banan, Golha orchestra under Khaleghi with Ma'rufi on piano), composed Azar 1339 per the rkac.com list, and recorded in Golha-ye Rangarang 237 (Persian Wikipedia, via Amir). Our 237 matches: Mahur, Banan, Khaleghi and Ma'rufi, «گهی خاموش و حیران»."
    basis_fa: "تصنیف «خاموش»، آخرین ساخته‌ی روح‌الله خالقی، در آذر ۱۳۳۹ ساخته و در این برنامه ضبط شد."

  # --- 1342-1346 ---------------------------------------------------------
  - program: "246"
    date: "1340-05-14"            # 1961-08-05, Constitution Day
    status: likely
    basis: "Constitution Day (14 Mordad). 246 and 246B are almost all Aref, the poet of the Constitutional Revolution, and both have «از خون جوانان وطن لاله دمیده» with Elaheh; 246 also «پیام دوشم از پیر می‌فروش آمد… یک ملتی به جوش آمد». Bijan Taraqqi recalls Pirnia asking him to replace «از خون جوانان وطن»; Taraqqi refused and suggested recording the tasnif and broadcasting it on the morning of the Constitution celebration, which Pirnia did (parand.se, via Amir). The year is the timeline's: 246 falls between Nowruz 1340 (241C) and Khaleghi's piece in 250 (composed Tir 1340). Replaces Amir's earlier Ordibehesht 1340 reading."
    basis_fa: "جشن مشروطیت (۱۴ مرداد): ۲۴۶ و ۲۴۶ب تقریباً همه از عارف‌اند و هر دو «از خون جوانان وطن لاله دمیده» را با صدای الهه دارند. به روایت بیژن ترقی، داوود پیرنیا خواست شعر این تصنیف عوض شود؛ ترقی نپذیرفت و پیشنهاد کرد تصنیف ضبط و صبح جشن مشروطیت پخش شود، و همین کار شد. سال را از جای برنامه در گاه‌شمار برآورد کرده‌ایم."
