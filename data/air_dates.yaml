    status: likely
    basis: "Hayedeh's first program: her career began in 1347 with «آزاده» (Tajvidi, on Rahi Moayyeri's last poem) with the Golha orchestra (Persian Wikipedia via last.fm). 470 is her first in our files and contains «آزاده‌ام من». Matches Amir's note that 470 is tied to Rahi."
    basis_fa: "نخستین برنامه‌ی هایده: «آزاده»، ساخته‌ی علی تجویدی بر آخرین سروده‌ی رهی معیری، در ۱۳۴۷."
  - program: "482"
