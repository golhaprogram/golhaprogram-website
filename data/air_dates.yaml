    basis: "A Khaleghi piece in it was composed 1343/03 — Khaleghi's works list with composition month/year (rkac.com, archived 2020, via Amir)"
    basis_fa: "یکی از قطعه‌های این برنامه، ساخته‌ی روح‌الله خالقی، در خرداد ۱۳۴۳ ساخته شده است (فهرست آثار خالقی)."
  - program: "398"
    date: "1345-01-01"            # 1966-03-21, Nowruz
    status: likely
    basis: "Nowruz throughout: «چو گشت از روی تو دل‌شاد نوروز… جهان در بزم نوروزی نشسته است»"
    basis_fa: "سراسر نوروزی: «جهان در بزم نوروزی نشسته است». نوروز ۱۳۴۵."
  - program: "405"
    date: "1345"                  # ~1966
    status: likely
    basis: "Amir: the last program recorded under Davud Pirnia. He left after the 1345 inspection by the Ministry of Information (Donya-e-Eqtesad); Radio Farda says he ran Golha for eleven years, until 1346. Recorded, not necessarily aired, then."
    basis_fa: "آخرین برنامه‌ای که زیر نظر داوود پیرنیا ضبط شد. پیرنیا پس از بازرسی وزارت اطلاعات در ۱۳۴۵ از گلها کناره گرفت."
  - program: "420"
    date: "1345-10-22"            # 1967-01-12, Thursday
    status: confirmed
    basis: "«آن که دلم را» (Mahasti): broadcast on Golha, Thursday 22 Dey 1345 — Mahasti's song list (Persian Wikipedia, via Amir). The weekday matches."
    basis_fa: "«آن که دلم را» با صدای مهستی، پخش‌شده در پنجشنبه ۲۲ دی ۱۳۴۵. تنها تاریخ پخش دقیقی که داریم."
  - program: "425"
    date: "1345-12"               # ~1967-03, the Nowruz program, aired before Nowruz
    status: likely
    basis: "«شادند جهانیان به نوروز و به عید… عید من و نوروز من امروز تویی»; 427 «بهار آمد و فروردین است». 428 aired in winter 1345, so 425–427 aired in late Esfand 1345, just before Nowruz."
    basis_fa: "«شادند جهانیان به نوروز و به عید». چون ۴۲۸ هنوز در زمستان پخش شده، این برنامه در اسفند ۱۳۴۵ پیش از نوروز پخش شده است."
  - program: "428"
    date: "1345-12"               # winter 1345, after 22 Dey (420)
    status: confirmed
    basis: "Broadcast on Golha in winter 1345 — Mahasti's song list (Persian Wikipedia, via Amir)"
    basis_fa: "پخش‌شده در زمستان ۱۳۴۵."
  - program: "429"
    date: "1346-01"               # ~1967-03/04, around Nowruz 1346
    status: likely
    basis: "Amir: 423–429 all have a spring theme (spring words jump in 423–429, then drop in 430). With 420 on 22 Dey and 428 in winter 1345, the block runs through Esfand 1345 and ends around Nowruz 1346."
    basis_fa: "برنامه‌های ۴۲۳ تا ۴۲۹ همه بهاری‌اند؛ ۴۲۹ حدود نوروز ۱۳۴۶."
  - program: "439"
    date: "1346-05-28"            # 1967-08-19
    status: likely
    basis: "«عید همایون… شهنشاه جاوید و پاینده باد، ولیعهد والاگهر زنده باد… دل شاه‌بانو فرحناک باد». Amir: 28 Mordad 1346, opening of the third Constituent Assembly, which made Farah regent; a prayer for the Shah, the Shahbanu and the crown prince together fits that day (28 Mordad was also the yearly royalist celebration of 1332). The assembly met in 1346 (ensani.ir); the exact opening date is per Amir. Nine slots before 448 (4 Aban 1346), about weekly, which fits."
    basis_fa: "«عید همایون… شهنشاه جاوید و پاینده باد، ولیعهد والاگهر زنده باد… دل شاه‌بانو فرحناک باد». دعای هم‌زمان برای شاه، شهبانو و ولیعهد با گشایش مجلس مؤسسان سوم در ۲۸ مرداد ۱۳۴۶ می‌خواند، که شهبانو فرح را نایب‌السلطنه کرد."
  - program: "448"
    date: "1346-08-04"            # 1967-10-26, coronation and the Shah's birthday
    status: likely
    basis: "«مبارک باد تاج پادشاهی… شاهنشه آریامهر»; also «آفرین خدا به شهبانو که ولیعهد نازپرور زاد» (Amir): the coronation (4 Aban) or the crown prince's birthday (9 Aban), the same week. 449 also «به شاهنشه آریامهر ما»"
    basis_fa: "«مبارک باد تاج پادشاهی»؛ «آفرین خدا به شهبانو که ولیعهد نازپرور زاد». تاجگذاری (۴ آبان) یا زادروز ولیعهد (۹ آبان) ۱۳۴۶."

  # --- 1347-1351 ---------------------------------------------------------
  - program: "461"
    date: "1347-01-01"            # 1968-03-21, Nowruz
    status: possible
    basis: "«گل بختم به پیروزی، شکفت از باد نوروزی»"
    basis_fa: "«گل بختم به پیروزی، شکفت از باد نوروزی». احتمالاً نوروز ۱۳۴۷."
  - program: "470"
