  - program: "557"
    date: "1350-06-30"            # 1971-09-21, three weeks before the celebrations
    status: likely
    basis: "Cyrus: «ای کوروش بزرگ… بنیان‌گزار کاخ شهنشاهی عجم»; 558 same theme. Amir: the run didn't air all at once. With B parts as separate weekly programs, 557–561 is seven programs, so about three weeks before and after the celebrations (20 Mehr)."
  - program: "559"
    date: "1350-07-20"            # 1971-10-12, 2500-year celebrations
    status: confirmed
    basis: "Amir; «سال کوروش بوَد امسال… جشن شاهنشهی کشور ایران باشد». 560 also about Cyrus."
  - program: "560"
