    basis_fa: "«روز نوروز است، سرو گلعذار من کجاست». ترانه‌ی «جدایی تو» از این برنامه در ۷ خرداد ۱۳۴۹ در «صفحات جدید هفته» روزنامه‌ی اطلاعات آمده است."
  - program: "529"
