# One place for every credit role shown on the site.
# Order here = order in the program-page credits and in the tag cloud tabs.
#   key       front-matter key and taxonomy (URL) name
#   one/many  label for one person / several people (program page)
#   list      heading of the taxonomy list page and tag-cloud tab
#   cloud     show as a tab in the home-page tag cloud
- key: singers
  one: خواننده
  many: خوانندگان
  list: خوانندگان
  cloud: true
