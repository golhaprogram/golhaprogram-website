  many: ترانه‌سرایان
  list: ترانه‌سرایان
  cloud: false
- key: poets
  one: شاعر
  many: شاعران
  list: شاعران
  cloud: true
- key: players
  one: نوازنده
  many: نوازندگان
  list: نوازندگان
  cloud: true
- key: conductors
  one: رهبر ارکستر
  many: رهبران ارکستر
