# Test environment used by Netlify deploy previews and branch deploys
# (they override baseURL), and by `npm run dev:beta`.
# The standalone beta.golhaprogram.com site was retired in Nov 2026.
baseURL = "/"

[params]
noindex = true

[params.remark42]
commentsHost = "comments-beta.golhaprogram.com"
commentsSiteId = "golhaprogram"
# remark42 server version; added to embed.js as ?v= so browsers fetch the
# new script after an upgrade. Bump it with each remark42 upgrade.
commentsVersion = "1.16"
