name: Audio metadata

# For PRs that add or change program files: fill in audio_bytes and
# audio_duration for any program missing them, and commit to the PR branch.
# Programs that already have both are skipped without installing anything.
# Fails if a newly added program's MP3 isn't on music.golhaprogram.com yet
# (edited programs only get a warning in the summary). Upload it, then re-run.

on:
  pull_request:
    paths:
      - 'content/programs/**/*.md'

# One run at a time per PR for this workflow. (Not shared with the other
# workflows: GitHub keeps only one waiting run per group and cancels the rest.)
# Several workflows may push to the same branch, so pushes rebase and retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  audio-metadata:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Use the base branch's tools if this branch predates them
        run: |
          # GitHub runs this workflow as it is after merging the PR into the base
          # branch, but the checkout is the PR branch alone, which may be older and
          # lack the files this job runs.
          git fetch -q origin ${{ github.base_ref }}
          for f in scripts/audio_metadata.py config/audioindex layouts/_default/home.audioindex.json; do
            if [ ! -e "$f" ]; then
              git checkout -q origin/${{ github.base_ref }} -- "$f" && git reset -q -- "$f"
              echo "Using $f from ${{ github.base_ref }}"
            fi
          done

      - name: Find changed program files
        id: changed
        run: |
          git fetch -q origin ${{ github.base_ref }}
          FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- 'content/programs/**/*.md' \
                  | grep -v '/_index\.md$' | tr '\n' ' ' || true)
          ADDED=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'content/programs/**/*.md' \
                  | grep -v '/_index\.md$' | tr '\n' ' ' || true)
          echo "Changed program files: ${FILES:-none}"
          # Only programs still missing a field need measuring; skip the rest
          # so a text-only edit doesn't install Hugo/ffmpeg for nothing.
          NEED=""
          for f in $FILES; do
            grep -q '^audio_bytes:' "$f" && grep -q '^audio_duration:' "$f" || NEED="$NEED $f"
          done
          echo "files=${NEED# }" >> "$GITHUB_OUTPUT"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "Programs to measure: ${NEED:- none}"

      - uses: peaceiris/actions-hugo@v3
        if: steps.changed.outputs.files != ''
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Install ffprobe
        if: steps.changed.outputs.files != ''
        run: command -v ffprobe || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Measure MP3s
        if: steps.changed.outputs.files != ''
        run: |
          npm ci --no-audit --no-fund   # Hugo also renders pages, whose JS imports fuse.js
          hugo -e audioindex -d /tmp/audioindex
          python3 scripts/audio_metadata.py --index /tmp/audioindex/audio-index.json \
            --report /tmp/report.md --fail-only-for "${{ steps.changed.outputs.added }}" \
            ${{ steps.changed.outputs.files }} || echo "FAILED=1" >> "$GITHUB_ENV"
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/programs
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -q -m "Add audio size and duration"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin ${{ github.head_ref }} && git push -q origin HEAD:${{ github.head_ref }} && break
              echo "Push failed, retrying ($i)"; sleep $((i * 5))
              [ $i = 5 ] && exit 1
            done
          fi

      - name: Fail if any MP3 is missing
        if: env.FAILED == '1'
        run: |
          echo "::error::Some MP3s could not be measured. See the job summary; upload them and re-run this job."
          exit 1
