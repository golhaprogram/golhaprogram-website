{{ define "main" }}
<article class="post">
  <header>
    <h1>{{ .Title }}</h1>
    {{- with .Date }}{{ if not .IsZero }}
    <time class="post-date" datetime="{{ .Format "2006-01-02" }}">{{ partial "fa-date" . }}</time>
    {{- end }}{{ end }}
  </header>
  <div class="content">
    {{ .Content }}
  </div>
  {{ partial "comments.html" . }}
</article>
{{ end }}
