<h3>دیدگاه‌ها</h3>

<div id="remark42" class="comments-section"></div>
<script>
  var remark_config = {
    host: "https://{{ .Site.Params.remark42.commentsHost }}",
    site_id: "{{ .Site.Params.remark42.commentsSiteId }}",
    components: ["embed"],
    max_shown_comments: 10,
    // Follow the visitor's light/dark setting. remark42 v1.16 fixed the white
    // backdrop its iframe used to get on dark pages, so the light-card
    // workaround is gone. The listener below switches if the setting changes.
    theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
    locale: "fa"
  };

  (function (c) {
    for (var i = 0; i < c.length; i++) {
      var d = document, s = d.createElement('script');
      s.src = remark_config.host + '/web/' + c[i] + '.js';
      s.defer = true;
      (d.head || d.body).appendChild(s);
    }
  })(remark_config.components || ['embed']);

  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (window.REMARK42 && window.REMARK42.changeTheme) {
        window.REMARK42.changeTheme(e.matches ? 'dark' : 'light');
      }
    });
  } catch (e) {}

</script>
