<h3>دیدگاه‌ها</h3>

<div id="remark42" class="comments-section"></div>
<script>
  var remark_config = {
    host: "https://{{ .Site.Params.remark42.commentsHost }}",
    site_id: "{{ .Site.Params.remark42.commentsSiteId }}",
    components: ["embed"],
    max_shown_comments: 10,
    // Always light: our remark42 (Oct 2024 build) doesn't coordinate its iframe's
    // color scheme with dark host pages, and some browsers (Android Chrome)
    // then paint a white backdrop behind it. In dark mode the comments sit on a
    // light card instead (see _comments.scss). Newer remark42 versions handle
    // dark host pages; after upgrading, theme can follow prefers-color-scheme.
    theme: "light",
    locale: "fa"
  };

  (function (c) {
    for (var i = 0; i < c.length; i++) {
      var d = document, s = d.createElement('script');
      s.src = remark_config.host + '/web/' + c[i] + '.js';
      s.defer = true;
      (d.head || d.body).appendChild(s);
    }
  })(remark_config.components || ['embed']);

</script>
