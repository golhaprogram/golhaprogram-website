{{ $audioURL := partial "audio-url" . }}
{{ $vtt := partial "lyrics-vtt.html" . }}

<div class="audio-player"{{ with $vtt }} data-lyrics-sync{{ end }}>
  <div class="audio-container">
    <audio controls preload="metadata">
      <source src="{{ $audioURL }}" type="audio/mpeg">
      {{- with $vtt }}
      <track kind="metadata" srclang="fa" label="شعر" src="{{ .RelPermalink }}">
      {{- end }}
      Your browser does not support the audio element.
    </audio>
    <a href="{{ $audioURL }}" download="{{ path.Base $audioURL }}" class="download-button" title="دانلود"
      onclick="event.preventDefault(); window.open(this.href, '_blank');">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    </a>
  </div>
  {{- with $vtt }}
  <button type="button" class="lyrics-follow" aria-pressed="true" hidden>
    <span class="lyrics-follow-switch" aria-hidden="true"></span>
    همراهی با شعر
  </button>
  {{- end }}
</div>
