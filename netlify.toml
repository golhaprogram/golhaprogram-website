[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.147.0"
NODE_VERSION = "22"
NPM_VERSION = "10"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

# Production context (main branch)
[context.production]
command = "hugo --gc --minify -e production"

# Branch deploys and deploy previews use the "beta" Hugo environment
# (config/beta): noindex, and comments from comments-beta.golhaprogram.com.
[context.branch-deploy]
# HUGO_PARAMS_HAMAHANG_SITE: Hamahang links load lyrics.txt and .vtt from this
# deploy itself, not from production (see [params.hamahang]).
command = "HUGO_PARAMS_HAMAHANG_SITE=\"$DEPLOY_PRIME_URL\" hugo --gc --minify -e beta --baseURL /"

[context.branch-deploy.environment]
HUGO_ENV = "beta"

# Deploy previews (PRs)
[context.deploy-preview]
# HUGO_PARAMS_HAMAHANG_SITE: Hamahang links load lyrics.txt and .vtt from this
# deploy itself, not from production (see [params.hamahang]).
command = "HUGO_PARAMS_HAMAHANG_SITE=\"$DEPLOY_PRIME_URL\" hugo --gc --minify -e beta --baseURL /"

[context.deploy-preview.environment]
HUGO_ENV = "beta"

# CORS headers for resources
[[headers]]
for = "/*.css"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET"
Cache-Control = "public, max-age=31536000"

[[headers]]
for = "/*.js"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET"
Cache-Control = "public, max-age=31536000"

# Timed lyrics (<program>.vtt next to the program's .md; see "Timed lyrics" in
# CLAUDE.md). The program page links them from its <audio>, so crawlers can
# find them: keep the raw timing files out of search results. The lyrics are
# already on the page itself.
[[headers]]
for = "/*.vtt"
[headers.values]
Content-Type = "text/vtt; charset=utf-8"
X-Robots-Tag = "noindex"
# Hamahang (on golhaprogram.github.io) loads existing timings to edit them
Access-Control-Allow-Origin = "*"

# Hamahang's inputs: each program's lyrics as plain text, and the page that
# opens Hamahang for it (see config/_default/config.toml, [params.hamahang]).
[[headers]]
for = "/*/lyrics.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
X-Robots-Tag = "noindex"
Access-Control-Allow-Origin = "*"

[[headers]]
for = "/*/hamahang.html"
[headers.values]
X-Robots-Tag = "noindex"

[[headers]]
for = "/*/hamahang"
[headers.values]
X-Robots-Tag = "noindex"

[[headers]]
for = "/fonts/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET"
Cache-Control = "public, max-age=31536000"

[[headers]]
for = "/images/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET"
Cache-Control = "public, max-age=31536000"

# Basic security headers for every response
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"

[[redirects]]
from = "https://www.golhaprogram.com/*"
to = "https://golhaprogram.com/:splat"
status = 301
force = true

[dev]
framework = "hugo"
targetPort = 1313

